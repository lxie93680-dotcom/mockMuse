services:
  linux-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.linux-worker
    environment:
      MUSE_LINUX_TOKEN: ${MUSE_LINUX_TOKEN:?Set a random token of at least 32 characters}
      MUSE_WORKSPACE: /workspace
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - linux-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
volumes:
  linux-workspace:
