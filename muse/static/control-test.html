<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>Muse 远程控制测试</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5ec;color:#244c38;font:20px system-ui;height:1600px}h1{position:absolute;left:80px;top:60px;margin:0}p{position:absolute;left:80px;top:115px}input{position:absolute;left:80px;top:200px;width:600px;height:50px;font:20px system-ui;padding:10px;border:1px solid #98ac88;border-radius:8px}button{position:absolute;left:700px;top:200px;width:100px;height:50px;font:18px system-ui;background:#244c38;color:#fff;border:0;border-radius:8px}#result{position:absolute;left:80px;top:280px}#box{position:absolute;left:80px;top:380px;width:140px;height:90px;background:#80a164;color:white;display:grid;place-items:center;border-radius:12px;user-select:none;cursor:grab}#dragResult{position:absolute;left:80px;top:540px}#bottom{position:absolute;top:1100px;left:80px;color:#547a3b;font-size:32px}</style><h1>远程浏览器控制测试</h1><p>点击输入框直接打字，按 Enter 确认；拖动绿色方块，滚轮向下。</p><form><input aria-label="测试输入" placeholder="点击这里直接打字"><button>确认</button></form><div id="result">等待输入</div><div id="box">拖动我</div><div id="dragResult">拖动坐标：80,380</div><div id="bottom">滚轮测试：你已到达页面下方</div><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='输入成功：'+document.querySelector('input').value;};const box=document.getElementById('box');let start=null;box.onpointerdown=e=>{start={x:e.clientX,y:e.clientY,left:box.offsetLeft,top:box.offsetTop};box.setPointerCapture(e.pointerId);};box.onpointermove=e=>{if(!start)return;box.style.left=(start.left+e.clientX-start.x)+'px';box.style.top=(start.top+e.clientY-start.y)+'px';document.getElementById('dragResult').textContent='拖动坐标：'+box.offsetLeft+','+box.offsetTop;};box.onpointerup=()=>{start=null;};</script></html>
