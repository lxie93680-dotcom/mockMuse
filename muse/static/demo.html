<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>Muse 浏览器测试页</title><style>body{font-family:system-ui;background:#f1f5ed;color:#244c38;padding:100px}main{background:white;padding:45px;border-radius:20px;max-width:650px;margin:auto}h1{font-size:38px}p{line-height:1.8;color:#74866d}input{font:inherit;padding:14px;border:1px solid #cbd7c4;border-radius:8px;width:65%}button{background:#244c38;color:white;font:inherit;padding:14px;border:0;border-radius:8px}#result{margin-top:30px;padding:20px;background:#f1f5ed;border-radius:10px}</style><main><p>MUSE · 浏览器测试页</p><h1>让浏览器替你行动。</h1><p>这是本地测试网页。演示会实际输入内容并点击按钮，<br>不调用模型，也不访问第三方网站。</p><form id="search"><input placeholder="输入搜索内容" aria-label="搜索内容"><button>搜索</button></form><div id="result">等待搜索…</div></main><script>document.getElementById('search').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='搜索成功：'+document.querySelector('input').value;};</script></html>
