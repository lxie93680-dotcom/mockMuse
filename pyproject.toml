[project]
name = "mockmuse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "openai-agents>=0.23.1",
    "mcp>=2.3,<3",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
muse = "muse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muse"]
