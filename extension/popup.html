<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Muse 连接器</title>
<style>body{font:14px system-ui;width:310px;padding:16px}input,button{box-sizing:border-box;width:100%;padding:9px;margin:5px 0}p{line-height:1.5}#status{white-space:pre-wrap}</style>
<h2>Muse 浏览器连接器</h2><p>自动连接本机工作台，Agent 可按任务读取、截图和切换 Chrome 网页，无需逐页授权。点击断开或关闭 Chrome 调试提示可停止自动控制。</p>
<label>工作台地址<input id="server" value="http://127.0.0.1:8000" placeholder="http://127.0.0.1:8000"></label>

<button id="connect">连接 / 恢复自动控制</button><button id="disconnect">断开控制</button><p id="status"></p><script src="popup.js"></script></html>
